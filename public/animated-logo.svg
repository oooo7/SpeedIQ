  <script type="text/javascript"><![CDATA[
    // Wave parameters
    const N       = 28;
    const STAGGER = 0.07;          // seconds between each line starting
    const DRAW    = 0.467;         // draw-in duration (s)
    const HOLD    = 0.467;         // fully visible hold (s)
    const RETRACT = 0.467;         // retract duration (s)
    const WINDOW  = DRAW + HOLD + RETRACT;   // 1.40s visible per line
    const CYCLE   = N * STAGGER;             // 1.96s — wave period

    // At any moment: WINDOW/STAGGER = 20 lines visible, guaranteed, no gaps.

    // Grab elements once
    const els = [];
    for (let i = 0; i < N; i++) els.push(document.getElementById('l' + i));

    // Easing
    function easeOut(t) { return 1 - (1 - t) * (1 - t); }
    function easeIn(t)  { return t * t; }

    let startTime = null;

    function tick(ts) {
      if (!startTime) startTime = ts;
      const elapsed = (ts - startTime) * 0.001; // ms → s

      for (let i = 0; i < N; i++) {
        // Shift elapsed time by this line's phase offset, wrap into [0, CYCLE)
        const tRel = ((elapsed - i * STAGGER) % CYCLE + CYCLE) % CYCLE;

        let offset;
        if (tRel < DRAW) {
          offset = 300 * (1 - easeOut(tRel / DRAW));
        } else if (tRel < DRAW + HOLD) {
          offset = 0;
        } else if (tRel < WINDOW) {
          offset = 300 * easeIn((tRel - DRAW - HOLD) / RETRACT);
        } else {
          offset = 300;
        }

        els[i].setAttribute('stroke-dashoffset', offset.toFixed(1));
      }

      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  ]]></script>

